<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Planning & Forecast</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body>
    <script>
        // Dynamically load forecast.js relative to the current path / subpath (e.g. /cs/ or /)
        (function() {
            var script = document.createElement('script');
            var basePath = window.location.pathname;
            if (!basePath.endsWith('/')) {
                basePath += '/';
            }
            script.src = basePath + 'forecast.js';
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
